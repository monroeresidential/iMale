name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/package-lock.json

      - run: npm ci
      - run: npm run build

      # public/data.enc and public/att/*.enc are committed as ciphertext. The plaintext
      # and the password never leave the workstation, so CI needs no secrets at all.
      - name: Confirm nothing readable shipped
        run: |
          if [ ! -f dist/data.enc ]; then
            echo "::error::dist/data.enc is missing — run 'npm run data' locally and commit it."
            exit 1
          fi
          # No email address may appear in the bundle (React's own code contains none).
          if grep -rqE '[A-Za-z0-9._%+-]+@[A-Za-z0-9-]+\.(com|net|org)' dist/assets dist/index.html; then
            echo "::error::Readable record content found in the bundle. Refusing to deploy."
            exit 1
          fi
          echo "Bundle clean: the record ships only as ciphertext."

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
